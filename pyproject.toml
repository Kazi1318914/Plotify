[tool.poetry]
name = "plotify"
version = "0.1.0"
description = "A Python plotting package with a dual Seaborn/Matplotlib + Plotly backend."
authors = ["Kazi1318914"]
readme = "README.md"
license = "MIT"
packages = [{ include = "plotify" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"
seaborn = ">=0.13"
plotly = ">=5.18"
kaleido = "0.2.1"
scipy = ">=1.10"
squarify = ">=0.4.3"
wordcloud = ">=1.9"
matplotlib-venn = ">=0.11"
circlify = ">=0.15"
networkx = ">=3.1"
geopandas = ">=0.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
